name: Adapter contracts

on:
  pull_request:
  workflow_dispatch:

jobs:
  published-extra:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: brax
            test: tests/adapters/test_brax_envelope.py
          - suite: craftax
            test: tests/adapters/test_craftax_envelope.py
          - suite: jumanji
            test: tests/adapters/test_jumanji_envelope.py
          - suite: mujoco-playground
            test: tests/adapters/test_mujoco_playground_envelope.py
          - suite: navix
            test: tests/adapters/test_navix_envelope.py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv build --wheel --no-sources
      - run: uv venv .adapter-venv
      - run: uv pip install --python .adapter-venv/bin/python "$(find dist -name '*.whl')[${{ matrix.suite }}]" pytest
      - run: .adapter-venv/bin/python -c "import envelope; import envelope.adapters"
      - run: .adapter-venv/bin/pytest ${{ matrix.test }} -m adapters

  source-backed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: gymnax
            test: tests/adapters/test_gymnax_envelope.py
          - suite: kinetix
            test: tests/adapters/test_kinetix_envelope.py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --group dev --group adapters --locked
      - run: uv run python -c "import ${{ matrix.suite == 'kinetix' && 'kinetix' || 'gymnax' }}"
      - run: uv run pytest ${{ matrix.test }} -m adapters
