[project]
name = "jax-envelope"
version = "0.1.1"
description = "A JAX-native environment interface with powerful wrappers and adapters for popular RL environment suites"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Jarek Liesen", email = "jarek.liesen@reuben.ox.ac.uk"},
]
dependencies = [
    "jax>=0.5.0",
]

license = {text = "MIT"}
keywords = [
    "machine-learning",
    "reinforcement-learning",
    "jax",
    "vectorization",
    "hardware-acceleration",
    "gymnasium",
    "environments",
    "deep-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/keraJLi/envelope"
Repository = "https://github.com/keraJLi/envelope"
Documentation = "https://github.com/keraJLi/envelope#readme"
Issues = "https://github.com/keraJLi/envelope/issues"
Changelog = "https://github.com/keraJLi/envelope/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/envelope"]

[dependency-groups]
benchmark = [
    "rejax",
]
compat = [
    "brax>=0.13.0",
    "craftax>=1.4.3",
    "navix>=0.7.0",
    "jumanji>=1.0.1",
    "playground>=0.1.0",
    "gymnax",
    # "kinetix-env",
]
dev = [
    "hypothesis>=6.148.1",
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.2",
]
ppo = [
    "distrax>=0.1.5",
    "flax>=0.12",
    "nnx>=0.0.8",
    "optax>=0.2.6",
    "tfp-nightly",  # current stable build only supports JAX 0.4.35
]

[tool.pytest.ini_options]
markers = [
  "compat: tests requiring optional compat dependencies",
]

[tool.uv.sources]
gymnax = { git = "https://github.com/RobertTLange/gymnax.git" }
kinetix-env = { git = "https://github.com/FLAIROx/Kinetix.git" }
