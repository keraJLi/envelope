[project]
name = "jax-envelope"
version = "0.5.0"
description = "A JAX-native environment interface with powerful wrappers and adapters for popular RL environment suites"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Jarek Liesen", email = "jarek.liesen@reuben.ox.ac.uk"},
]
dependencies = [
    "jax>=0.5.0",
]

license = {text = "MIT"}
keywords = [
    "machine-learning",
    "reinforcement-learning",
    "jax",
    "vectorization",
    "hardware-acceleration",
    "gymnasium",
    "environments",
    "deep-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/keraJLi/envelope"
Repository = "https://github.com/keraJLi/envelope"
Documentation = "https://github.com/keraJLi/envelope#readme"
Issues = "https://github.com/keraJLi/envelope/issues"
Changelog = "https://github.com/keraJLi/envelope/releases"

[project.optional-dependencies]
brax = ["brax>=0.13.0"]
craftax = ["craftax>=1.6.0"]
jumanji = [
    "jumanji>=1.0.1",
    # Jumanji 1.1.1 imports requests for Sokoban but omits it from its metadata.
    "requests",
]
mujoco-playground = ["playground>=0.1.0"]
navix = ["navix>=0.7.0"]
ppo = [
    "distrax>=0.1.7",
    "flax>=0.12.3",
    "gymnax",
    "optax>=0.2.6",
    "tyro>=0.9.35",
    "wandb>=0.24.1",
]
adapters = [
    "brax>=0.13.0",
    "craftax>=1.6.0",
    "jumanji>=1.0.1",
    # Jumanji 1.1.1 imports requests for Sokoban but omits it from its metadata.
    "requests",
    "playground>=0.1.0",
    "navix>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/envelope"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/.github",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/mkdocs.yml",
    "/.readthedocs.yaml",
]
exclude = [
    "/.gitignore",
]

[dependency-groups]
adapters = [
    "brax>=0.13.0",
    "craftax>=1.6.0",
    "navix>=0.7.0",
    "jumanji>=1.0.1",
    # Jumanji 1.1.1 imports requests for Sokoban but omits it from its metadata.
    "requests",
    "playground>=0.1.0",
    "gymnax",
    "kinetix-env",
]
gymnax-adapter = ["gymnax"]
kinetix-adapter = ["kinetix-env"]
dev = [
    "hypothesis>=6.148.1",
    "pre-commit>=4.0.0",
    "ty>=0.0.59",
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.2",
]
[tool.uv]
override-dependencies = [
    "tensorflow-probability>=0.26.0.dev20260116",
]

[tool.uv.sources]
gymnax = { git = "https://github.com/RobertTLange/gymnax.git", rev = "18f2e7f3cffafc7042c76fdc538c83957418a9a9" }
kinetix-env = { git = "https://github.com/FLAIROx/Kinetix.git", rev = "df4de60cabd42dbd1c35fb5214fdc6728710e33d" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "adapters: tests requiring optional adapters dependencies",
  "packaging: tests that build and inspect distribution artifacts",
  "ppo: tests requiring optional PPO dependencies",
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src/envelope"]

[tool.ruff.lint]
extend-select = ["I"]
