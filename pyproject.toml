[project]
name = "jax-envelope"
version = "0.5.0"
description = "A JAX-native environment interface with powerful wrappers and adapters for popular RL environment suites"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Jarek Liesen", email = "jarek.liesen@reuben.ox.ac.uk"},
]
dependencies = [
    "jax>=0.5.0",
]
license = {text = "MIT"}
keywords = [
    "machine-learning",
    "reinforcement-learning",
    "jax",
    "vectorization",
    "hardware-acceleration",
    "gymnasium",
    "environments",
    "deep-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/keraJLi/envelope"
Repository = "https://github.com/keraJLi/envelope"
Documentation = "https://github.com/keraJLi/envelope#readme"
Issues = "https://github.com/keraJLi/envelope/issues"
Changelog = "https://github.com/keraJLi/envelope/releases"

[project.optional-dependencies]
brax = ["brax>=0.13,<0.15"]
craftax = ["craftax>=1.5,<2"]
jumanji = ["jumanji>=1.0.1,<2"]
mujoco-playground = ["playground>=0.1,<0.2"]
navix = ["navix>=0.7,<0.8"]
adapters = [
    "brax>=0.13,<0.15",
    "craftax>=1.5,<2",
    "jumanji>=1.0.1,<2",
    "playground>=0.1,<0.2",
    "navix>=0.7,<0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/envelope"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/.github",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/mkdocs.yml",
    "/.readthedocs.yaml",
]
exclude = [
    "/.gitignore",
    "/examples/ppo",
    "/tests/ppo",
    "/runs",
    "/checkpoints",
    "/wandb",
    "/*.jsonl",
]

[dependency-groups]
adapters = [
    "brax>=0.13.0",
    "craftax>=1.4.3",
    "navix>=0.7.0",
    "jumanji>=1.0.1",
    "playground>=0.1.0",
    "gymnax",
    "kinetix-env",
]
gymnax-adapter = ["gymnax"]
kinetix-adapter = ["kinetix-env"]
dev = [
    "hypothesis>=6.148.1",
    "pyright>=1.1.407",
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.2",
]
ppo = [
    "distrax>=0.1.7,<0.2",
    "flax>=0.10,<1",
    "optax>=0.2.4,<0.3",
    "tyro>=0.9,<1",
]
ppo-wandb = [
    "wandb>=0.19,<1",
]

[tool.uv]
override-dependencies = [
    "tensorflow-probability>=0.26.0.dev20260116",
]

[tool.uv.sources]
gymnax = { git = "https://github.com/RobertTLange/gymnax.git", rev = "18f2e7f3cffafc7042c76fdc538c83957418a9a9" }
kinetix-env = { git = "https://github.com/FLAIROx/Kinetix.git", rev = "df4de60cabd42dbd1c35fb5214fdc6728710e33d" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "adapters: tests requiring optional adapters dependencies",
  "packaging: tests that build and inspect distribution artifacts",
  "ppo: tests requiring the repository-only PPO dependency group",
]

[tool.pyright]
include = ["src/envelope"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
